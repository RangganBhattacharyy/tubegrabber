<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TubeGrabber</title>
<style>
  :root {
    --bg: #12100e;
    --panel: #1b1815;
    --panel-line: #322c26;
    --paper: #ece6da;
    --accent: #e8542c;
    --accent-dim: #7a3220;
    --spool: #55493a;
    --ok: #7fae5f;
    --err: #d1544a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 10%, #201c17 0%, var(--bg) 55%);
    color: var(--paper);
    font-family: "Courier New", ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .deck {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 14px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.03);
    padding: 28px 28px 24px;
  }

  .deck-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }

  .brand {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 0.5px;
    color: var(--paper);
  }
  .brand span { color: var(--accent); }

  .reels {
    display: flex;
    gap: 10px;
  }
  .reel {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 3px solid var(--spool);
    position: relative;
  }
  .reel::after {
    content: "";
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    background: var(--spool);
  }
  .reel.spin { animation: spin 2.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  label {
    display: block;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #a89b86;
    margin: 16px 0 6px;
  }

  .platform-row {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .platform-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 12px 6px;
    background: #0f0d0b;
    border: 1px solid var(--panel-line);
    border-radius: 8px;
    cursor: pointer;
    color: #a89b86;
    font-family: inherit;
    font-size: 10.5px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .platform-btn svg { width: 20px; height: 20px; }
  .platform-btn:hover { border-color: #55493a; color: var(--paper); }
  .platform-btn.active {
    border-color: var(--accent);
    color: var(--paper);
    background: #1c140f;
  }
  .platform-btn.active svg { color: var(--accent); }

  .platform-note {
    font-size: 11px;
    color: #6d6353;
    margin-top: 8px;
    line-height: 1.5;
    min-height: 16px;
  }
  .platform-note.warn { color: #c99a3f; }

  input[type="text"], textarea {
    width: 100%;
    background: #0f0d0b;
    border: 1px solid var(--panel-line);
    color: var(--paper);
    padding: 12px 14px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  input[type="text"]:focus, textarea:focus { border-color: var(--accent); }

  textarea {
    resize: vertical;
    min-height: 84px;
    line-height: 1.5;
  }

  .url-hint {
    font-size: 11px;
    color: #6d6353;
    margin-top: 6px;
  }
  .url-count {
    color: var(--accent);
  }

  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }

  select {
    width: 100%;
    background: #0f0d0b;
    border: 1px solid var(--panel-line);
    color: var(--paper);
    padding: 11px 12px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
  }

  .toggles {
    display: flex;
    gap: 18px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #cdc2ae;
    cursor: pointer;
    user-select: none;
  }
  .toggle input { accent-color: var(--accent); width: 15px; height: 15px; }

  button.grab {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #17110c;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  button.grab:hover { background: #f16a41; }
  button.grab:active { transform: scale(0.98); }
  button.grab:disabled { background: var(--accent-dim); cursor: not-allowed; }

  .status-block {
    margin-top: 20px;
    display: none;
  }
  .status-block.show { display: block; }

  .status-line {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #a89b86;
    margin-bottom: 6px;
  }

  .strip {
    height: 14px;
    border-radius: 4px;
    background: repeating-linear-gradient(
      90deg,
      #0f0d0b 0px, #0f0d0b 6px,
      #171310 6px, #171310 8px
    );
    border: 1px solid var(--panel-line);
    overflow: hidden;
    position: relative;
  }
  .strip-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    transition: width 0.3s ease;
  }

  .msg {
    margin-top: 10px;
    font-size: 12.5px;
    color: #cdc2ae;
    min-height: 18px;
  }
  .msg.ok { color: var(--ok); }
  .msg.err { color: var(--err); }

  .footnote {
    margin-top: 20px;
    font-size: 10.5px;
    color: #6d6353;
    line-height: 1.5;
    border-top: 1px dashed var(--panel-line);
    padding-top: 12px;
  }
</style>
</head>
<body>

  <div class="deck">
    <div class="deck-head">
      <div class="brand">Tube<span>Grabber</span></div>
      <div class="reels">
        <div class="reel" id="reelA"></div>
        <div class="reel" id="reelB"></div>
      </div>
    </div>

    <label>Platform</label>
    <div class="platform-row" id="platformRow">
      <button type="button" class="platform-btn active" data-platform="youtube" data-placeholder="https://www.youtube.com/watch?v=...&#10;https://www.youtube.com/watch?v=...">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4L15.8 12Z"/></svg>
        YouTube
      </button>
      <button type="button" class="platform-btn" data-platform="instagram" data-placeholder="https://www.instagram.com/reel/...&#10;https://www.instagram.com/p/...">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.2" cy="6.8" r="1"/></svg>
        Instagram
      </button>
      <button type="button" class="platform-btn" data-platform="facebook" data-placeholder="https://www.facebook.com/watch?v=...&#10;https://fb.watch/...">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21.9v-8.4h2.8l.4-3.3h-3.2V8.1c0-1 .3-1.6 1.7-1.6h1.6V3.6c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.7H7.8v3.3h2.8v8.4h2.9Z"/></svg>
        Facebook
      </button>
      <button type="button" class="platform-btn" data-platform="other" data-placeholder="Paste the podcast or video page link here...">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10.5 13.5a3.5 3.5 0 0 0 5 0l3-3a3.54 3.54 0 0 0-5-5l-1 1"/><path d="M13.5 10.5a3.5 3.5 0 0 0-5 0l-3 3a3.54 3.54 0 0 0 5 5l1-1"/></svg>
        Aaro Ananda / Other
      </button>
    </div>
    <div class="platform-note" id="platformNote"></div>

    <label for="url">Video or playlist URLs</label>
    <textarea id="url" rows="4" placeholder="https://www.youtube.com/watch?v=...&#10;https://www.youtube.com/watch?v=...&#10;https://www.youtube.com/watch?v=..."></textarea>
    <div class="url-hint">Paste one link per line to queue up several. <span class="url-count" id="urlCount"></span></div>

    <div class="row">
      <div>
        <label for="quality">Quality</label>
        <select id="quality">
          <option value="best">Best available</option>
          <option value="1080p">1080p</option>
          <option value="720p">720p</option>
          <option value="480p">480p</option>
          <option value="360p">360p</option>
        </select>
      </div>
    </div>

    <div class="toggles">
      <label class="toggle">
        <input type="checkbox" id="audioOnly" />
        Audio only (mp3)
      </label>
      <label class="toggle">
        <input type="checkbox" id="playlist" />
        Full playlist
      </label>
    </div>

    <button class="grab" id="grabBtn">Grab it</button>

    <div class="status-block" id="statusBlock">
      <div class="status-line">
        <span id="queueLabel"></span>
      </div>
      <div class="status-line">
        <span id="statusLabel">Starting…</span>
        <span id="statusPct">0%</span>
      </div>
      <div class="strip"><div class="strip-fill" id="fill"></div></div>
      <div class="status-line" id="overallLine" style="display:none; margin-top:10px;">
        <span>Overall</span>
        <span id="overallPct">0%</span>
      </div>
      <div class="strip" id="overallStrip" style="display:none;"><div class="strip-fill" id="overallFill"></div></div>
      <div class="msg" id="msg"></div>
    </div>

    <div class="footnote">
      Only download videos you own, that are public domain, or that you have permission to save.
      Files land in the <code>downloads/</code> folder next to this app.[cite: 1]
    </div>
  </div>

<script>
const grabBtn = document.getElementById('grabBtn');
const urlInput = document.getElementById('url');
const urlCount = document.getElementById('urlCount');
const platformButtons = document.querySelectorAll('.platform-btn');
const platformNote = document.getElementById('platformNote');
const statusBlock = document.getElementById('statusBlock');
const queueLabel = document.getElementById('queueLabel');
const statusLabel = document.getElementById('statusLabel');
const statusPct = document.getElementById('statusPct');
const fill = document.getElementById('fill');
const overallLine = document.getElementById('overallLine');
const overallStrip = document.getElementById('overallStrip');
const overallPct = document.getElementById('overallPct');
const overallFill = document.getElementById('overallFill');
const msg = document.getElementById('msg');
const reelA = document.getElementById('reelA');
const reelB = document.getElementById('reelB');

let poll = null;

const platformNotes = {
  youtube: '',
  instagram: 'Public reels and posts usually work. Private accounts will fail.',
  facebook: 'Public videos usually work. Some Facebook links need you to be logged in, which this tool can\'t do.',
  other: 'This tries a generic downloader for non-YouTube sites like Aaro Ananda. It works for some pages and not others — if it fails, the error message will say why.',
};

platformButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    platformButtons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    urlInput.placeholder = btn.dataset.placeholder;
    const note = platformNotes[btn.dataset.platform] || '';
    platformNote.textContent = note;
    platformNote.className = 'platform-note' + (btn.dataset.platform === 'other' || btn.dataset.platform === 'facebook' ? ' warn' : '');
  });
});

function parseUrls(text) {
  return text
    .split(/[\n,]/)
    .map(s => s.trim())
    .filter(Boolean);
}

urlInput.addEventListener('input', () => {
  const n = parseUrls(urlInput.value).length;
  urlCount.textContent = n > 1 ? `${n} links queued` : '';
});

grabBtn.addEventListener('click', async () => {
  const urls = parseUrls(urlInput.value);
  if (urls.length === 0) {
    msg.textContent = 'Paste at least one URL first.';
    msg.className = 'msg err';
    return;
  }

  const payload = {
    urls,
    quality: document.getElementById('quality').value,
    audio_only: document.getElementById('audioOnly').checked,
    playlist: document.getElementById('playlist').checked,
  };

  grabBtn.disabled = true;
  grabBtn.textContent = 'Working…';
  statusBlock.classList.add('show');
  queueLabel.textContent = urls.length > 1 ? `Queue: 1 of ${urls.length}` : '';
  statusLabel.textContent = 'Starting…';
  statusPct.textContent = '0%';
  fill.style.width = '0%';
  overallLine.style.display = urls.length > 1 ? 'flex' : 'none';
  overallStrip.style.display = urls.length > 1 ? 'block' : 'none';
  overallPct.textContent = '0%';
  overallFill.style.width = '0%';
  msg.textContent = '';
  msg.className = 'msg';
  reelA.classList.add('spin');
  reelB.classList.add('spin');

  try {
    const res = await fetch('/api/download', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || 'Could not start download');
    }

    poll = setInterval(() => checkStatus(data.job_id), 800);
  } catch (e) {
    finishWithError(e.message);
  }
});

async function checkStatus(jobId) {
  try {
    const res = await fetch(`/api/status/${jobId}`);
    const data = await res.json();
    const total = data.total || 1;

    if (total > 1) {
      const shown = Math.min(data.current_index + 1, total);
      queueLabel.textContent = `Queue: ${shown} of ${total}`;
      overallLine.style.display = 'flex';
      overallStrip.style.display = 'block';
      overallPct.textContent = `${data.progress}%`;
      overallFill.style.width = `${data.progress}%`;
    }

    if (data.status === 'downloading') {
      statusLabel.textContent = data.filename || 'Downloading…';
      statusPct.textContent = `${data.file_progress ?? data.progress}%`;
      fill.style.width = `${data.file_progress ?? data.progress}%`;
    } else if (data.status === 'processing') {
      statusLabel.textContent = 'Processing…';
      statusPct.textContent = '100%';
      fill.style.width = '100%';
    } else if (data.status === 'done') {
      clearInterval(poll);
      statusLabel.textContent = 'Complete';
      statusPct.textContent = '100%';
      fill.style.width = '100%';
      overallPct.textContent = '100%';
      overallFill.style.width = '100%';
      const failed = data.failed || [];
      if (failed.length > 0) {
        msg.textContent = `Saved ${data.completed.length} of ${total}. ${failed.length} link(s) failed.`;
        msg.className = 'msg err';
      } else {
        msg.textContent = total > 1
          ? `All ${total} downloads saved to downloads.`
          : 'Saved to downloads.';
        msg.className = 'msg ok';
      }

      // অটোমেটিক ব্রাউজার ডাউনলোড ট্রিগার করার জন্য
      if (data.filename) {
        const downloadLink = document.createElement('a');
        downloadLink.href = `/downloads/${encodeURIComponent(data.filename)}`;
        downloadLink.click();
      }

      resetButton();
    } else if (data.status === 'error') {
      clearInterval(poll);
      finishWithError(data.error || 'Download failed.');
    }
  } catch (e) {
    clearInterval(poll);
    finishWithError('Lost connection to the server.');
  }
}

function finishWithError(text) {
  msg.textContent = text;
  msg.className = 'msg err';
  resetButton();
}

function resetButton() {
  grabBtn.disabled = false;
  grabBtn.textContent = 'Grab it';
  reelA.classList.remove('spin');
  reelB.classList.remove('spin');
}
</script>

</body>
</html>
